<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard — POS</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function(){
      const t = localStorage.getItem('pos_theme') || 'dark';
      if (t === 'light') document.documentElement.classList.add('light-early');
    })();
  </script>
  <style>
    html.light-early body { background: #f0f2f7; }
    .items-cell { max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    @media(max-width:600px){ .items-cell { max-width:120px; } }
  </style>
</head>
<body>
<div id="toast"></div>
<div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;"></div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🛒</div>
      <div class="sidebar-logo-text"><h2>POS System</h2><p>Management Suite</p></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="theme-toggle-wrap">
      <button class="theme-toggle" onclick="toggleTheme()">
        <span class="toggle-icon" id="themeIcon">🌙</span>
        <span class="toggle-label" id="themeLabel">Dark Mode</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </button>
    </div>
    <div class="sidebar-footer" id="sidebarUser"></div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
        <h1>Dashboard</h1>
      </div>
      <div class="topbar-right"><span class="topbar-meta" id="topbarDate"></span></div>
    </div>

    <div class="page-body">
      <div class="stat-grid">
        <div class="stat-card blue">
          <div class="stat-label">Total Products</div>
          <div class="stat-value" id="totalProducts">—</div>
          <div class="stat-icon">📦</div>
        </div>
        <div class="stat-card green">
          <div class="stat-label">Stock Value</div>
          <div class="stat-value" id="stockValue">—</div>
          <div class="stat-icon">💰</div>
        </div>
        <div class="stat-card yellow">
          <div class="stat-label">Today's Sales</div>
          <div class="stat-value" id="todaySales">—</div>
          <div class="stat-icon">📈</div>
        </div>
        <div class="stat-card red">
          <div class="stat-label">Low Stock Items</div>
          <div class="stat-value" id="lowStock">—</div>
          <div class="stat-icon">⚠️</div>
        </div>
      </div>

      <div class="section-title">Recent Sales</div>
      <div class="table-wrap" style="margin-bottom:28px;">
        <div class="table-scroll">
          <table>
            <thead><tr><th>Date</th><th>Bill No</th><th>Items</th><th>Total</th></tr></thead>
            <tbody id="recentSales">
              <tr><td colspan="4"><div class="empty-state"><div class="empty-icon">⏳</div><p>Loading…</p></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="section-title">Low Stock Alert</div>
      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead><tr><th>Product</th><th>Category</th><th>Qty</th><th>Status</th></tr></thead>
            <tbody id="lowStockTable">
              <tr><td colspan="4"><div class="empty-state"><div class="empty-icon">⏳</div><p>Loading…</p></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── YOUR FIREBASE CONFIG ──
  const firebaseConfig = {
    apiKey: "AIzaSyDaTSGKMP97MWnekd3bompU3xIOCLaFs00",
    authDomain: "supermarketpos-4418d.firebaseapp.com",
    projectId: "supermarketpos-4418d",
    storageBucket: "supermarketpos-4418d.firebasestorage.app",
    messagingSenderId: "1026352540452",
    appId: "1:1026352540452:web:63b8d785bab0006e30a1b1",
    measurementId: "G-85N214C84P"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const user = authGuard(['admin']);
  if (!user) throw new Error('not authorized');
  buildSidebar(user);

  let products = [];
  let sales    = [];

  function renderDashboard() {
    const today = new Date().toISOString().split('T')[0];

    let stockValue = 0, low = 0, todayTotal = 0;
    products.forEach(p => {
      stockValue += (p.qty || 0) * (p.price || 0);
      if ((p.qty || 0) < 5) low++;
    });
    sales.forEach(s => { if (s.date === today) todayTotal += s.total || 0; });

    document.getElementById('totalProducts').textContent = products.length;
    document.getElementById('stockValue').textContent    = 'Rs ' + stockValue.toLocaleString();
    document.getElementById('todaySales').textContent    = 'Rs ' + todayTotal.toLocaleString();
    document.getElementById('lowStock').textContent      = low;

    // Recent sales
    const recentEl = document.getElementById('recentSales');
    const recent   = [...sales].slice(0, 5);
    if (recent.length === 0) {
      recentEl.innerHTML = `<tr><td colspan="4"><div class="empty-state"><div class="empty-icon">📭</div><p>No sales yet</p></div></td></tr>`;
    } else {
      recentEl.innerHTML = recent.map(s => `
        <tr>
          <td style="font-family:'JetBrains Mono',monospace;font-size:12px;">${s.date}</td>
          <td><span class="badge badge-blue">#${String(s.billNo).slice(-6)}</span></td>
          <td class="items-cell">${s.items.map(x=>x.name).join(', ')}</td>
          <td style="color:var(--success);font-family:'JetBrains Mono',monospace;font-weight:600;">Rs ${s.total.toLocaleString()}</td>
        </tr>`).join('');
    }

    // Low stock
    const lowEl    = document.getElementById('lowStockTable');
    const lowItems = products.filter(p => (p.qty || 0) < 5);
    if (lowItems.length === 0) {
      lowEl.innerHTML = `<tr><td colspan="4"><div class="empty-state"><div class="empty-icon">✅</div><p>All items well stocked</p></div></td></tr>`;
    } else {
      lowEl.innerHTML = lowItems.map(p => `
        <tr>
          <td style="font-weight:600;color:var(--text);">${p.name}</td>
          <td><span class="badge badge-blue">${p.category}</span></td>
          <td style="font-family:'JetBrains Mono',monospace;">${p.qty}</td>
          <td><span class="badge ${p.qty === 0 ? 'badge-red' : 'badge-yellow'}">${p.qty === 0 ? 'Out of Stock' : 'Low Stock'}</span></td>
        </tr>`).join('');
    }
  }

  // Live listeners — auto update when data changes
  onSnapshot(collection(db, 'products'), snap => {
    products = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    renderDashboard();
  });

  onSnapshot(query(collection(db, 'sales'), orderBy('billNo', 'desc')), snap => {
    sales = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    renderDashboard();
  });
</script>
</body>
</html>
