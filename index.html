<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Login</title>
  <link rel="stylesheet" href="style.css">
  <!-- Early theme: prevents flash on page load -->
  <script>
    (function(){
      const t = localStorage.getItem('pos_theme') || 'dark';
      if (t === 'light') document.documentElement.classList.add('light-early');
    })();
  </script>
  <style>
    html.light-early body { background: #f0f2f7; }

    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }

    .login-wrap {
      width: 100%; max-width: 420px; padding: 20px;
      animation: pageIn 0.4s cubic-bezier(0.4,0,0.2,1) both;
    }

    .login-logo { text-align: center; margin-bottom: 36px; }

    .login-logo .logo-box {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 16px;
      box-shadow: 0 8px 32px var(--accent-glow);
      transition: box-shadow var(--transition);
    }

    .login-logo h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .login-logo p { font-size: 13px; color: var(--text3); margin-top: 4px; }

    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px;
      box-shadow: var(--card-shadow);
      transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .login-card h2 { font-size: 15px; font-weight: 700; margin-bottom: 24px; color: var(--text2); }

    .input-group { margin-bottom: 16px; }
    .input-group label {
      display: block; font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text3); margin-bottom: 8px;
      transition: color var(--transition);
    }
    .input-group input { width: 100%; padding: 12px 16px; font-size: 14px; }

    .login-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white; border: none; border-radius: var(--radius-sm);
      font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 8px; transition: all 0.2s;
      letter-spacing: 0.02em; box-shadow: 0 4px 20px var(--accent-glow);
    }
    .login-btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 8px 28px var(--accent-glow); }
    .login-btn:active { transform: translateY(0); }

    .login-error {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
      border-radius: var(--radius-sm); padding: 10px 14px; color: var(--danger);
      font-size: 13px; margin-bottom: 16px; display: none;
      animation: pageIn 0.2s ease;
    }
    .login-error.show { display: block; }

    .hint-label { font-size: 11px; color: var(--text3); text-align: center; margin-top: 20px; margin-bottom: 10px; }

    .hint-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .hint-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px; cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
    }
    .hint-card:hover { border-color: var(--accent); background: var(--accent-glow); }
    .hint-card .role-name { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 4px; }
    .hint-card .role-creds { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text3); }

    .theme-toggle-login {
      position: fixed; top: 20px; right: 20px;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 99px; cursor: pointer;
      transition: all var(--transition);
      font-size: 13px; font-weight: 600; color: var(--text2);
    }
    .theme-toggle-login:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 480px) {
      .login-card { padding: 22px; }
      .login-wrap { padding: 16px; }
      .hint-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<button class="theme-toggle-login" onclick="toggleThemeLogin()">
  <span id="themeIcon">🌙</span>
  <span id="themeLabel">Dark</span>
</button>

<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-box">🛒</div>
    <h1>POS System</h1>
    <p>Point of Sale &amp; Inventory Manager</p>
  </div>

  <div class="login-card">
    <h2>Sign in to continue</h2>
    <div class="login-error" id="loginError">Invalid username or password.</div>

    <div class="input-group">
      <label>Username</label>
      <input type="text" id="loginId" placeholder="Enter username" autocomplete="username">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') doLogin()">
    </div>

    <button class="login-btn" onclick="doLogin()">Sign In →</button>

    <div class="hint-label">Quick fill — click a role:</div>
    <div class="hint-cards">
      <div class="hint-card" onclick="fillCreds('admin','admin123')">
        <div class="role-name">🔑 Admin</div>
        <div class="role-creds">admin / admin123</div>
      </div>
      <div class="hint-card" onclick="fillCreds('cashier','cash123')">
        <div class="role-name">🧾 Cashier</div>
        <div class="role-creds">cashier / cash123</div>
      </div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  // Sync toggle UI on load
  (function() {
    const saved = localStorage.getItem('pos_theme') || 'dark';
    if (saved === 'light') document.body.classList.add('light');
    syncLoginToggle(saved === 'light');
  })();

  function syncLoginToggle(isLight) {
    const icon = document.getElementById('themeIcon');
    const label = document.getElementById('themeLabel');
    if (icon) icon.textContent = isLight ? '☀️' : '🌙';
    if (label) label.textContent = isLight ? 'Light' : 'Dark';
  }

  function toggleThemeLogin() {
    const isLight = document.body.classList.toggle('light');
    localStorage.setItem('pos_theme', isLight ? 'light' : 'dark');
    syncLoginToggle(isLight);
  }

  // Redirect if already logged in
  const existing = authGetUser();
  if (existing) {
    window.location.href = existing.role === 'cashier' ? 'sell.html' : 'dashboard.html';
  }

  function fillCreds(id, pass) {
    document.getElementById('loginId').value = id;
    document.getElementById('loginPass').value = pass;
  }

  function doLogin() {
    const id = document.getElementById('loginId').value.trim();
    const pass = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');
    const user = authLogin(id, pass);
    if (user) {
      window.location.href = user.role === 'cashier' ? 'sell.html' : 'dashboard.html';
    } else {
      err.classList.add('show');
      setTimeout(() => err.classList.remove('show'), 3000);
    }
  }
</script>
</body>
</html>
