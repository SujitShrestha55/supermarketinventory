<!DOCTYPE html>
<html>
<head>
    <title>Sales Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="topnav">
        <a href="dashboard.html">Dashboard</a>
        <a href="index.html">Sell</a>
        <a href="list.html">Inventory</a>
        <a href="sales.html">Sales</a>
    </div>

    <h1>Sales Report</h1>

    <!-- FILTERS -->
    <div style="margin-bottom:10px;">

        <input id="billFilter" placeholder="Search Bill No" oninput="renderSales()">

        <input type="date" id="dateFilter" onchange="renderSales()">

        <input type="month" id="monthFilter" onchange="renderSales()">

        <button onclick="clearFilters()">Clear Filters</button>

    </div>

    <!-- SUMMARY -->
    <div class="dashboard-grid">

        <div class="card">
            <h3>Total Sales</h3>
            <h2 id="totalSales">0</h2>
        </div>

        <div class="card">
            <h3>Today's Sales</h3>
            <h2 id="todaySales">0</h2>
        </div>

        <div class="card">
            <h3>Total Bills</h3>
            <h2 id="totalBills">0</h2>
        </div>

    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Bill No</th>
                <th>Items</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="salesBody"></tbody>
    </table>

    <!-- RECEIPT -->
    <div id="receipt"></div>

</div>

<script src="script.js"></script>
</body>
</html>
