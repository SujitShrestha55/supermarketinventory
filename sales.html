<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sales — POS</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function(){
      const t = localStorage.getItem('pos_theme') || 'dark';
      if (t === 'light') document.documentElement.classList.add('light-early');
    })();
  </script>
  <style>
    html.light-early body { background: #f0f2f7; }
    .sales-filters { display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:flex-end; }
    .sales-filters input[type="text"] { flex:1 1 160px;min-width:120px; }
    .sales-filter-group { display:flex;flex-direction:column;gap:4px;flex:0 0 auto; }
    .sales-filter-group label { font-size:10.5px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;line-height:1; }
    .sales-filter-group input { height:40px;padding:0 10px;box-sizing:border-box;border-radius:var(--radius-sm,8px);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color 0.15s;width:140px; }
    .sales-filter-group input:focus { border-color:var(--accent); }
    .sales-filters .btn { align-self:flex-end;height:40px; }
    input[type="date"],input[type="month"] { -webkit-appearance:none;appearance:none;color-scheme:dark; }
    body.light input[type="date"],body.light input[type="month"] { color-scheme:light; }
    @media(max-width:600px){
      .sales-filters{gap:8px}
      .sales-filters input[type="text"]{flex:1 1 100%}
      .sales-filter-group{flex:1 1 calc(50% - 4px)}
      .sales-filter-group input{width:100%}
      .sales-filters .btn{flex:1 1 100%}
    }
  </style>
</head>
<body>
<div id="toast"></div>
<div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;"></div>

<!-- RECEIPT MODAL -->
<div class="modal-overlay" id="receiptModal">
  <div class="modal">
    <h3>🧾 Sale Receipt</h3>
    <div id="receiptContent"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('receiptModal').classList.remove('open')">Close</button>
      <button class="btn btn-primary" id="printBtn">🖨 Print</button>
    </div>
  </div>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🛒</div>
      <div class="sidebar-logo-text"><h2>POS System</h2><p>Management Suite</p></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="theme-toggle-wrap">
      <button class="theme-toggle" onclick="toggleTheme()">
        <span class="toggle-icon" id="themeIcon">🌙</span>
        <span class="toggle-label" id="themeLabel">Dark Mode</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </button>
    </div>
    <div class="sidebar-footer" id="sidebarUser"></div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
        <h1>Sales Report</h1>
      </div>
      <div class="topbar-right"><span class="topbar-meta" id="topbarDate"></span></div>
    </div>

    <div class="page-body">
      <div class="stat-grid" style="margin-bottom:24px;">
        <div class="stat-card green"><div class="stat-label">Total Revenue</div><div class="stat-value" id="totalSales">Rs 0</div><div class="stat-icon">💰</div></div>
        <div class="stat-card blue"><div class="stat-label">Today's Sales</div><div class="stat-value" id="todaySales">Rs 0</div><div class="stat-icon">📅</div></div>
        <div class="stat-card yellow"><div class="stat-label">Total Bills</div><div class="stat-value" id="totalBills">0</div><div class="stat-icon">🧾</div></div>
      </div>

      <div class="sales-filters">
        <input type="text" id="billFilter" placeholder="🔍  Search bill…" oninput="renderSales()">
        <div class="sales-filter-group"><label>Date</label><input type="date" id="dateFilter" onchange="renderSales()"></div>
        <div class="sales-filter-group"><label>Month</label><input type="month" id="monthFilter" onchange="renderSales()"></div>
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()">✕ Clear</button>
      </div>

      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead><tr><th>Date</th><th>Bill No</th><th>Cashier</th><th>Items</th><th>Total</th><th>Actions</th></tr></thead>
            <tbody id="salesBody"><tr><td colspan="6"><div class="empty-state"><div class="empty-icon">⏳</div><p>Loading…</p></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, deleteDoc, onSnapshot, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── PASTE YOUR CONFIG HERE ──
 const firebaseConfig = {
  apiKey: "AIzaSyDaTSGKMP97MWnekd3bompU3xIOCLaFs00",
  authDomain: "supermarketpos-4418d.firebaseapp.com",
  projectId: "supermarketpos-4418d",
  storageBucket: "supermarketpos-4418d.firebasestorage.app",
  messagingSenderId: "1026352540452",
  appId: "1:1026352540452:web:63b8d785bab0006e30a1b1",
  measurementId: "G-85N214C84P"
};

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const user = authGuard(['admin']);
  if (!user) throw new Error('not authorized');
  buildSidebar(user);

  let allSales = [];

  onSnapshot(query(collection(db,'sales'), orderBy('billNo','desc')), snap => {
    allSales = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    renderSales();
  });

  window.renderSales = function() {
    const billFilter  = document.getElementById('billFilter').value.toLowerCase();
    const dateFilter  = document.getElementById('dateFilter').value;
    const monthFilter = document.getElementById('monthFilter').value;
    const today       = new Date().toISOString().split('T')[0];

    let filtered = [...allSales];
    if (billFilter)  filtered = filtered.filter(s => String(s.billNo).includes(billFilter) || (s.cashier||'').toLowerCase().includes(billFilter));
    if (dateFilter)  filtered = filtered.filter(s => s.date === dateFilter);
    if (monthFilter) filtered = filtered.filter(s => s.date && s.date.startsWith(monthFilter));

    let total = 0, todayTotal = 0;
    allSales.forEach(s => { total += s.total; if(s.date===today) todayTotal += s.total; });

    document.getElementById('totalSales').textContent = `Rs ${total.toLocaleString()}`;
    document.getElementById('todaySales').textContent = `Rs ${todayTotal.toLocaleString()}`;
    document.getElementById('totalBills').textContent  = filtered.length;

    const tbody = document.getElementById('salesBody');
    if (filtered.length === 0) {
      tbody.innerHTML=`<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📭</div><p>No sales records found</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map(s => `
      <tr>
        <td style="font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap;">${s.date}</td>
        <td><span class="badge badge-blue">#${String(s.billNo).slice(-6)}</span></td>
        <td style="font-weight:500;white-space:nowrap;">${s.cashier||'—'}</td>
        <td style="font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.items.map(x=>x.name).join(', ')}</td>
        <td style="font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--success);white-space:nowrap;">Rs ${s.total.toLocaleString()}</td>
        <td style="white-space:nowrap;">
          <button class="btn btn-ghost btn-sm" data-view="${s._id}">👁 View</button>
          <button class="btn btn-danger btn-sm" data-del="${s._id}" data-bill="${String(s.billNo).slice(-6)}" style="margin-left:4px;">🗑</button>
        </td>
      </tr>`).join('');

    tbody.querySelectorAll('[data-view]').forEach(btn =>
      btn.addEventListener('click', () => viewSale(btn.dataset.view)));
    tbody.querySelectorAll('[data-del]').forEach(btn =>
      btn.addEventListener('click', () => deleteSaleById(btn.dataset.del, btn.dataset.bill)));
  };

  let currentPrintSale = null;

  function viewSale(id) {
    const s = allSales.find(x => x._id === id);
    if (!s) return;
    currentPrintSale = s;
    document.getElementById('receiptContent').innerHTML = `
      <div style="font-size:11.5px;color:var(--text3);margin-bottom:14px;font-family:'JetBrains Mono',monospace;">
        Bill #${s.billNo} · ${s.date} · ${s.cashier||'N/A'}
      </div>
      <div class="receipt-card">
        ${s.items.map(it=>`<div class="receipt-row"><span>${it.name} × ${it.qty}</span><span>Rs ${it.total.toLocaleString()}</span></div>`).join('')}
        <hr>
        <div class="receipt-row receipt-total"><span>TOTAL</span><span>Rs ${s.total.toLocaleString()}</span></div>
      </div>`;
    document.getElementById('printBtn').onclick = () => printBill(currentPrintSale);
    document.getElementById('receiptModal').classList.add('open');
  }

  async function deleteSaleById(id, billNum) {
    if (!confirm(`Delete bill #${billNum}?`)) return;
    try {
      await deleteDoc(doc(db,'sales',id));
      toast('Sale deleted');
    } catch(e) { toast('Error deleting sale','error'); }
  }

  function printBill(b) {
    const win = window.open('','','width=380,height=500');
    win.document.write(`<html><head><title>Receipt</title><style>
      body{font-family:'Courier New',monospace;padding:20px;font-size:13px;}
      h2{text-align:center;}.row{display:flex;justify-content:space-between;margin:6px 0;}
      hr{border:none;border-top:1px dashed #aaa;margin:12px 0;}
      .total{font-size:16px;font-weight:bold;}.footer{text-align:center;margin-top:20px;font-size:11px;color:#666;}
    </style></head><body>
      <h2>🛒 POS Receipt</h2>
      <div class="row"><span>Bill:</span><span>#${b.billNo}</span></div>
      <div class="row"><span>Date:</span><span>${b.date}</span></div>
      <div class="row"><span>Cashier:</span><span>${b.cashier||'N/A'}</span></div><hr>
      ${b.items.map(it=>`<div class="row"><span>${it.name} ×${it.qty}</span><span>Rs ${it.total}</span></div>`).join('')}
      <hr><div class="row total"><span>TOTAL</span><span>Rs ${b.total}</span></div>
      <div class="footer">Thank you!</div>
    </body></html>`);
    win.document.close(); win.focus(); win.print();
  }

  window.clearFilters = function() {
    document.getElementById('billFilter').value = '';
    document.getElementById('dateFilter').value = '';
    document.getElementById('monthFilter').value = '';
    renderSales();
  };

  document.getElementById('receiptModal').addEventListener('click', function(e) {
    if(e.target===this) this.classList.remove('open');
  });
</script>
</body>
</html>
