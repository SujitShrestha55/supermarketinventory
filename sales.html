<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales — POS</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function(){
      const t = localStorage.getItem('pos_theme') || 'dark';
      if (t === 'light') document.documentElement.classList.add('light-early');
    })();
  </script>
  <style>
    html.light-early body { background: #f0f2f7; }
  </style>
</head>
<body>
<div id="toast"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- RECEIPT MODAL -->
<div class="modal-overlay" id="receiptModal">
  <div class="modal">
    <h3>🧾 Sale Receipt</h3>
    <div id="receiptContent"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('receiptModal').classList.remove('open')">Close</button>
      <button class="btn btn-primary" id="printBtn">🖨 Print</button>
    </div>
  </div>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🛒</div>
      <div class="sidebar-logo-text">
        <h2>POS System</h2>
        <p>Management Suite</p>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="theme-toggle-wrap">
      <button class="theme-toggle" onclick="toggleTheme()">
        <span class="toggle-icon" id="themeIcon">🌙</span>
        <span class="toggle-label" id="themeLabel">Dark Mode</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </button>
    </div>
    <div class="sidebar-footer" id="sidebarUser"></div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <h1>Sales Report</h1>
      </div>
      <div class="topbar-right">
        <span class="topbar-meta" id="topbarDate"></span>
      </div>
    </div>

    <div class="page-body">

      <div class="stat-grid" style="margin-bottom:24px;">
        <div class="stat-card green">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value" id="totalSales">Rs 0</div>
          <div class="stat-icon">💰</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-label">Today's Sales</div>
          <div class="stat-value" id="todaySales">Rs 0</div>
          <div class="stat-icon">📅</div>
        </div>
        <div class="stat-card yellow">
          <div class="stat-label">Total Bills</div>
          <div class="stat-value" id="totalBills">0</div>
          <div class="stat-icon">🧾</div>
        </div>
      </div>

      <!-- FILTERS -->
      <div class="filter-bar" style="margin-bottom:20px;">
        <input id="billFilter" placeholder="🔍  Search bill…" oninput="renderSales()">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="dateFilter" onchange="renderSales()">
        </div>
        <div class="form-group">
          <label>Month</label>
          <input type="month" id="monthFilter" onchange="renderSales()">
        </div>
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()">✕ Clear</button>
      </div>

      <!-- TABLE -->
      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Date</th><th>Bill No</th><th>Cashier</th>
                <th>Items</th><th>Total</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="salesBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  const user = authGuard(['admin']);
  if (user) {
    buildSidebar(user);

    const now = new Date();
    document.getElementById('topbarDate').textContent =
      now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    function renderSales() {
      const sales = getSales();
      const billFilter = document.getElementById('billFilter').value.toLowerCase();
      const dateFilter = document.getElementById('dateFilter').value;
      const monthFilter = document.getElementById('monthFilter').value;
      const today = new Date().toISOString().split('T')[0];

      let filtered = [...sales].reverse();
      if (billFilter) filtered = filtered.filter(s => String(s.billNo).includes(billFilter));
      if (dateFilter) filtered = filtered.filter(s => s.date === dateFilter);
      if (monthFilter) filtered = filtered.filter(s => s.date.startsWith(monthFilter));

      let total = 0, todayTotal = 0;
      sales.forEach(s => { total += s.total; if (s.date === today) todayTotal += s.total; });

      document.getElementById('totalSales').textContent = `Rs ${total.toLocaleString()}`;
      document.getElementById('todaySales').textContent = `Rs ${todayTotal.toLocaleString()}`;
      document.getElementById('totalBills').textContent = filtered.length;

      const tbody = document.getElementById('salesBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📭</div><p>No sales records found</p></div></td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(s => {
        const origIdx = sales.findIndex(x => x.billNo === s.billNo);
        return `
          <tr>
            <td style="font-family:'JetBrains Mono',monospace;font-size:12px;">${s.date}</td>
            <td><span class="badge badge-blue">#${String(s.billNo).slice(-6)}</span></td>
            <td style="font-weight:500;">${s.cashier || '—'}</td>
            <td style="font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.items.map(x => x.name).join(', ')}</td>
            <td style="font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--success);">Rs ${s.total.toLocaleString()}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-ghost btn-sm" onclick="viewSale(${origIdx})">👁 View</button>
              <button class="btn btn-danger btn-sm" onclick="deleteSale(${origIdx})" style="margin-left:6px;">🗑</button>
            </td>
          </tr>`;
      }).join('');
    }

    let currentPrintSale = null;

    function viewSale(i) {
      const s = getSales()[i];
      currentPrintSale = s;
      document.getElementById('receiptContent').innerHTML = `
        <div style="font-size:11.5px;color:var(--text3);margin-bottom:14px;font-family:'JetBrains Mono',monospace;">
          Bill #${s.billNo} · ${s.date} · ${s.cashier || 'N/A'}
        </div>
        <div class="receipt-card">
          ${s.items.map(it => `
            <div class="receipt-row"><span>${it.name} × ${it.qty}</span><span>Rs ${it.total.toLocaleString()}</span></div>
          `).join('')}
          <hr>
          <div class="receipt-row receipt-total"><span>TOTAL</span><span>Rs ${s.total.toLocaleString()}</span></div>
        </div>`;
      document.getElementById('printBtn').onclick = () => printBill(currentPrintSale);
      document.getElementById('receiptModal').classList.add('open');
    }

    function printBill(b) {
      const win = window.open('', '', 'width=380,height=500');
      win.document.write(`<html><head><title>Receipt</title><style>
        body{font-family:'Courier New',monospace;padding:20px;font-size:13px;}
        h2{text-align:center;}.row{display:flex;justify-content:space-between;margin:6px 0;}
        hr{border:none;border-top:1px dashed #aaa;margin:12px 0;}
        .total{font-size:16px;font-weight:bold;}.footer{text-align:center;margin-top:20px;font-size:11px;color:#666;}
      </style></head><body>
        <h2>🛒 POS Receipt</h2>
        <div class="row"><span>Bill:</span><span>#${b.billNo}</span></div>
        <div class="row"><span>Date:</span><span>${b.date}</span></div>
        <div class="row"><span>Cashier:</span><span>${b.cashier||'N/A'}</span></div>
        <hr>
        ${b.items.map(it=>`<div class="row"><span>${it.name} ×${it.qty}</span><span>Rs ${it.total}</span></div>`).join('')}
        <hr>
        <div class="row total"><span>TOTAL</span><span>Rs ${b.total}</span></div>
        <div class="footer">Thank you!</div>
      </body></html>`);
      win.document.close(); win.focus(); win.print();
    }

    function deleteSale(i) {
      const sales = getSales();
      if (!confirm(`Delete bill #${String(sales[i].billNo).slice(-6)}?`)) return;
      sales.splice(i, 1);
      saveSales(sales);
      toast('Sale deleted');
      renderSales();
    }

    function clearFilters() {
      document.getElementById('billFilter').value = '';
      document.getElementById('dateFilter').value = '';
      document.getElementById('monthFilter').value = '';
      renderSales();
    }

    document.getElementById('receiptModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    renderSales();
  }
</script>
</body>
</html>
