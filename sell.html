<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sell — POS</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function(){
      const t = localStorage.getItem('pos_theme') || 'dark';
      if (t === 'light') document.documentElement.classList.add('light-early');
    })();
  </script>
  <style>
    html.light-early body { background: #f0f2f7; }
    .sell-page-body { display:flex;flex-direction:column;flex:1;overflow:hidden;padding:0!important;height:calc(100vh - var(--topbar-h)); }
    .sell-shell { display:flex;flex:1;overflow:hidden;padding-right:320px; }
    .sell-products { flex:1;display:flex;flex-direction:column;overflow:hidden;padding:16px;min-width:0; }
    .sell-filter { display:flex;gap:10px;align-items:center;flex-shrink:0;padding-bottom:12px; }
    .sell-filter input { flex:1;min-width:0; }
    .sell-filter select { flex:0 0 auto;width:150px; }
    .sell-table-container { flex:1;overflow:hidden;display:flex;flex-direction:column;border-radius:12px;border:1px solid var(--border);background:var(--surface); }
    .sell-thead-wrap { flex-shrink:0;background:var(--surface2);border-bottom:1px solid var(--border);border-radius:12px 12px 0 0;overflow:hidden; }
    .sell-thead-wrap table { width:100%;border-collapse:collapse;table-layout:fixed; }
    .sell-tbody-wrap { flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border-hover) transparent; }
    .sell-tbody-wrap::-webkit-scrollbar { width:5px; }
    .sell-tbody-wrap::-webkit-scrollbar-track { background:transparent; }
    .sell-tbody-wrap::-webkit-scrollbar-thumb { background:var(--border-hover);border-radius:99px; }
    .sell-tbody-wrap table { width:100%;border-collapse:collapse;table-layout:fixed; }
    .col-product{width:22%}.col-category{width:20%}.col-stock{width:13%}.col-price{width:16%}.col-qty{width:13%}.col-add{width:16%}
    th { padding:11px 12px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);text-align:left; }
    td { padding:10px 12px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border); }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:var(--surface2);transition:background 0.15s; }
    .qty-input { width:52px;text-align:center;padding:7px 4px!important;font-family:'JetBrains Mono',monospace;font-size:13px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text); }
    .cart-panel { width:320px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);position:fixed;top:var(--topbar-h);right:0;bottom:0;z-index:150; }
    .cart-header { display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0; }
    .cart-header h3 { font-size:14px;font-weight:700;margin:0; }
    .cart-top-action { padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface); }
    .cart-total-row { display:flex;justify-content:space-between;align-items:center;margin-bottom:10px; }
    .cart-total-label { font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:0.08em; }
    .cart-total-value { font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--success); }
    .cart-items { flex:1;overflow-y:auto;padding:10px;scrollbar-width:thin;scrollbar-color:var(--border-hover) transparent; }
    .cart-items::-webkit-scrollbar { width:5px; }
    .cart-items::-webkit-scrollbar-thumb { background:var(--border-hover);border-radius:99px; }
    .cart-item { display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;margin-bottom:4px;background:var(--surface2);animation:cartItemIn 0.2s ease both; }
    @keyframes cartItemIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
    .cart-item-name { font-size:13px;font-weight:600;color:var(--text); }
    .cart-item-qty { font-size:11px;color:var(--text3);margin-top:2px; }
    .cart-item-price { font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--success);white-space:nowrap; }
    .cart-item-remove { background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:3px 6px;border-radius:4px;transition:0.15s;flex-shrink:0; }
    .cart-item-remove:hover { color:var(--danger);background:rgba(239,68,68,0.1); }
    .cart-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:395;display:none; }
    .cart-overlay.active { display:block; }
    .cart-toggle-btn { display:none;position:fixed;bottom:24px;right:20px;z-index:140;align-items:center;gap:7px;background:var(--success);color:#fff;border:none;border-radius:99px;padding:13px 20px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.35);transition:transform 0.15s; }
    .cart-toggle-btn:active { transform:scale(0.96); }
    .cart-toggle-btn .cnt { background:rgba(255,255,255,0.3);border-radius:99px;padding:2px 7px;font-size:12px;min-width:20px;text-align:center; }
    .cart-close-btn { display:none;background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:2px 8px;border-radius:6px;line-height:1; }
    @media(max-width:1100px){.cart-panel{width:280px}.sell-shell{padding-right:280px}}
    @media(max-width:900px){.cart-panel{width:260px}.sell-shell{padding-right:260px}}
    @media(max-width:640px){
      .sell-shell{overflow:hidden;height:100%;flex-direction:column;padding-right:0}
      .sell-products{overflow:hidden;height:100%;padding:12px;padding-bottom:0}
      .sell-filter select{width:110px}
      .cart-toggle-btn{display:flex}
      .cart-close-btn{display:flex!important}
      .cart-panel{top:0;right:0;bottom:0;width:min(300px,88vw);z-index:400;transform:translateX(100%);box-shadow:-4px 0 30px rgba(0,0,0,0.3)}
      .cart-panel.cart-open{transform:translateX(0)}
      th,td{padding:8px;font-size:11.5px}
      .qty-input{width:40px;padding:5px 3px!important;font-size:11px}
    }
  </style>
</head>
<body>
<div id="toast"></div>
<div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;"></div>
<div id="cartOverlay" class="cart-overlay"></div>

<!-- RECEIPT MODAL -->
<div class="receipt-modal" id="receiptModal">
  <div class="receipt-box">
    <h3>🧾 Sale Complete</h3>
    <div class="receipt-sub" id="receiptBillNo"></div>
    <div id="receiptContent"></div>
    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;">
      <button class="btn btn-ghost" style="flex:1;min-width:120px;" onclick="closeReceipt()">Close</button>
      <button class="btn btn-primary" style="flex:1;min-width:120px;" onclick="printReceipt()">🖨 Print</button>
    </div>
  </div>
</div>

<div class="app-shell">
  <aside class="sidebar" id="mainSidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🛒</div>
      <div class="sidebar-logo-text"><h2>POS System</h2><p>Management Suite</p></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="theme-toggle-wrap">
      <button class="theme-toggle" onclick="toggleTheme()">
        <span class="toggle-icon" id="themeIcon">🌙</span>
        <span class="toggle-label" id="themeLabel">Dark Mode</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </button>
    </div>
    <div class="sidebar-footer" id="sidebarUser"></div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Toggle menu" type="button"><span></span><span></span><span></span></button>
        <h1>Point of Sale</h1>
      </div>
      <div class="topbar-right"><span class="topbar-meta" id="topbarDate"></span></div>
    </div>

    <button class="cart-toggle-btn" id="cartFAB" type="button">🛒 Cart <span class="cnt" id="cartToggleCount">0</span></button>

    <div class="page-body sell-page-body">
      <div class="sell-shell">
        <div class="sell-products">
          <div class="sell-filter">
            <input id="search" placeholder="🔍  Search products…" oninput="searchItems()">
            <select id="catFilter" onchange="searchItems()">
              <option value="">All Categories</option>
              <option>Drinks</option><option>Snacks</option><option>Dairy</option><option>Grocery</option>
            </select>
          </div>
          <div class="sell-table-container">
            <div class="sell-thead-wrap">
              <table>
                <colgroup><col class="col-product"><col class="col-category"><col class="col-stock"><col class="col-price"><col class="col-qty"><col class="col-add"></colgroup>
                <thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Price</th><th>Qty</th><th>Add</th></tr></thead>
              </table>
            </div>
            <div class="sell-tbody-wrap">
              <table>
                <colgroup><col class="col-product"><col class="col-category"><col class="col-stock"><col class="col-price"><col class="col-qty"><col class="col-add"></colgroup>
                <tbody id="sellBody"><tr><td colspan="6"><div class="empty-state"><div class="empty-icon">⏳</div><p>Loading…</p></div></td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CART PANEL -->
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3>🛒 Cart</h3>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="cartCount" class="badge badge-blue">0 items</span>
      <button class="cart-close-btn" id="cartCloseBtn" type="button">✕</button>
    </div>
  </div>
  <div class="cart-top-action">
    <div class="cart-total-row">
      <span class="cart-total-label">Grand Total</span>
      <span class="cart-total-value" id="grandTotal">Rs 0</span>
    </div>
    <button class="btn btn-success" id="checkoutBtn" type="button" style="width:100%;padding:14px;font-size:14px;">✓ Checkout</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="empty-state"><div class="empty-icon">🛒</div><p>Cart is empty</p></div>
  </div>
</div>

<script src="auth.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot, writeBatch }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── PASTE YOUR CONFIG HERE ──
const firebaseConfig = {
  apiKey: "AIzaSyDaTSGKMP97MWnekd3bompU3xIOCLaFs00",
  authDomain: "supermarketpos-4418d.firebaseapp.com",
  projectId: "supermarketpos-4418d",
  storageBucket: "supermarketpos-4418d.firebasestorage.app",
  messagingSenderId: "1026352540452",
  appId: "1:1026352540452:web:63b8d785bab0006e30a1b1",
  measurementId: "G-85N214C84P"
};

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const user = authGuard(['admin', 'cashier']);
  if (!user) throw new Error('not authorized');
  buildSidebar(user);

  // ── PRODUCTS (live) ──
  let products = [];
  onSnapshot(collection(db, 'products'), snap => {
    products = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    searchItems();
  });

  // ── CART STATE ──
  let cart = [];
  let lastBillData = null;

  const isMob = () => window.innerWidth <= 640;

  // ── CART UI ──
  const cartPanel   = document.getElementById('cartPanel');
  const cartOverlay = document.getElementById('cartOverlay');
  const cartFAB     = document.getElementById('cartFAB');

  function openCart()  { cartPanel.classList.add('cart-open'); cartOverlay.classList.add('active'); if(cartFAB) cartFAB.style.display='none'; document.body.style.overflow='hidden'; }
  function closeCart() { cartPanel.classList.remove('cart-open'); cartOverlay.classList.remove('active'); if(cartFAB) cartFAB.style.display=''; document.body.style.overflow=''; }

  cartFAB.addEventListener('click', openCart);
  document.getElementById('cartCloseBtn').addEventListener('click', closeCart);
  cartOverlay.addEventListener('click', closeCart);
  document.getElementById('checkoutBtn').addEventListener('click', checkout);
  document.addEventListener('keydown', e => { if(e.key==='Escape'){ if(window._closeSidebar) window._closeSidebar(); closeCart(); }});

  function renderCart() {
    const total = cart.reduce((s,c) => s+c.total, 0);
    document.getElementById('cartCount').textContent = `${cart.length} item${cart.length!==1?'s':''}`;
    document.getElementById('grandTotal').textContent = `Rs ${total.toLocaleString()}`;
    document.getElementById('cartToggleCount').textContent = cart.length;
    const el = document.getElementById('cartItems');
    if (cart.length === 0) { el.innerHTML=`<div class="empty-state"><div class="empty-icon">🛒</div><p>Cart is empty</p></div>`; return; }
    el.innerHTML = cart.map((c,i) => `
      <div class="cart-item">
        <div style="flex:1;min-width:0;">
          <div class="cart-item-name">${c.name}</div>
          <div class="cart-item-qty">× ${c.qty} @ Rs ${c.price.toLocaleString()}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
          <span class="cart-item-price">Rs ${c.total.toLocaleString()}</span>
          <button class="cart-item-remove" data-idx="${i}" type="button">✕</button>
        </div>
      </div>`).join('');
    el.querySelectorAll('.cart-item-remove').forEach(btn =>
      btn.addEventListener('click', function() { cart.splice(parseInt(this.dataset.idx),1); renderCart(); }));
  }

  // ── PRODUCT LIST ──
  window.searchItems = function() {
    const tbody  = document.getElementById('sellBody');
    const search = document.getElementById('search').value.toLowerCase();
    const cat    = document.getElementById('catFilter').value;
    let filtered = [...products];
    if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search));
    if (cat)    filtered = filtered.filter(p => p.category === cat);

    if (products.length === 0) {
      tbody.innerHTML=`<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">⏳</div><p>Loading products…</p></div></td></tr>`;
      return;
    }
    if (filtered.length === 0) {
      tbody.innerHTML=`<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🔍</div><p>No products found</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map(p => `
      <tr>
        <td style="font-weight:600;color:var(--text);">${p.name}</td>
        <td><span class="badge badge-blue">${p.category}</span></td>
        <td style="font-family:'JetBrains Mono',monospace;font-weight:600;${p.qty<5?'color:var(--warn);':'color:var(--success);'}">
          ${p.qty<5?'⚠ ':''}${p.qty}
        </td>
        <td style="font-family:'JetBrains Mono',monospace;font-weight:600;">Rs ${p.price.toLocaleString()}</td>
        <td><input class="qty-input" data-id="${p._id}" type="number" placeholder="1" min="1" max="${p.qty}"></td>
        <td><button class="btn btn-primary btn-sm add-btn" data-id="${p._id}" type="button" ${p.qty===0?'disabled':''}>
          ${p.qty===0?'Out':'+ Add'}
        </button></td>
      </tr>`).join('');

    tbody.querySelectorAll('.add-btn').forEach(btn =>
      btn.addEventListener('click', () => addToCart(btn.dataset.id)));
  };

  function addToCart(id) {
    const p = products.find(x => x._id === id);
    if (!p) return;
    const qtyEl = document.querySelector(`.qty-input[data-id="${id}"]`);
    const qty   = parseInt(qtyEl.value) || 1;
    if (qty <= 0)    { toast('Enter a valid quantity','error'); return; }
    if (qty > p.qty) { toast(`Only ${p.qty} in stock`,'error'); return; }
    const existing = cart.find(c => c._id === id);
    if (existing) {
      if (existing.qty+qty > p.qty) { toast('Not enough stock','error'); return; }
      existing.qty  += qty;
      existing.total = existing.qty * p.price;
    } else {
      cart.push({ _id: id, name: p.name, qty, price: p.price, total: qty*p.price });
    }
    qtyEl.value = '';
    toast(`${p.name} added`);
    renderCart();
    if (isMob()) openCart();
  }

  // ── CHECKOUT ──
  async function checkout() {
    if (cart.length === 0) { toast('Cart is empty','error'); return; }
    document.getElementById('checkoutBtn').disabled = true;
    try {
      const batch     = writeBatch(db);
      const billNo    = Date.now();
      const totalAmt  = cart.reduce((s,c) => s+c.total, 0);

      // deduct stock for each cart item
      cart.forEach(c => {
        const p = products.find(x => x._id === c._id);
        if (p) batch.update(doc(db,'products',c._id), { qty: p.qty - c.qty });
      });

      // save sale
      const saleRef = doc(collection(db,'sales'));
      const bill = {
        billNo,
        items:   cart.map(c => ({ name:c.name, qty:c.qty, price:c.price, total:c.total })),
        total:   totalAmt,
        date:    new Date().toISOString().split('T')[0],
        cashier: user.name
      };
      batch.set(saleRef, bill);
      await batch.commit();

      lastBillData = bill;
      cart = [];
      renderCart();
      closeCart();
      showReceipt(bill);
    } catch(e) {
      toast('Checkout failed','error');
      console.error(e);
    }
    document.getElementById('checkoutBtn').disabled = false;
  }

  function showReceipt(bill) {
    document.getElementById('receiptBillNo').textContent = `Bill #${String(bill.billNo).slice(-8)} · ${bill.date}`;
    document.getElementById('receiptContent').innerHTML = `
      <div class="receipt-card">
        ${bill.items.map(it=>`<div class="receipt-row"><span>${it.name} × ${it.qty}</span><span>Rs ${it.total.toLocaleString()}</span></div>`).join('')}
        <hr>
        <div class="receipt-row receipt-total"><span>TOTAL</span><span>Rs ${bill.total.toLocaleString()}</span></div>
        <div style="margin-top:8px;font-size:11px;color:var(--text3);">Cashier: ${bill.cashier}</div>
      </div>`;
    document.getElementById('receiptModal').classList.add('open');
  }

  window.closeReceipt = () => document.getElementById('receiptModal').classList.remove('open');

  window.printReceipt = function() {
    if (!lastBillData) return;
    const b = lastBillData;
    const win = window.open('','','width=380,height=500');
    win.document.write(`<html><head><title>Receipt</title><style>
      body{font-family:'Courier New',monospace;padding:20px;font-size:13px;}
      h2{text-align:center;}.row{display:flex;justify-content:space-between;margin:6px 0;}
      hr{border:none;border-top:1px dashed #aaa;margin:12px 0;}
      .total{font-size:16px;font-weight:bold;}.footer{text-align:center;margin-top:20px;font-size:11px;color:#666;}
    </style></head><body>
      <h2>🛒 POS Receipt</h2>
      <div class="row"><span>Bill:</span><span>#${b.billNo}</span></div>
      <div class="row"><span>Date:</span><span>${b.date}</span></div>
      <div class="row"><span>Cashier:</span><span>${b.cashier||'N/A'}</span></div><hr>
      ${b.items.map(it=>`<div class="row"><span>${it.name} ×${it.qty}</span><span>Rs ${it.total}</span></div>`).join('')}
      <hr><div class="row total"><span>TOTAL</span><span>Rs ${b.total}</span></div>
      <div class="footer">Thank you for your purchase!</div>
    </body></html>`);
    win.document.close(); win.focus(); win.print();
  };
</script>
</body>
</html>
