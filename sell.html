<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell — POS</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function(){
      const t = localStorage.getItem('pos_theme') || 'dark';
      if (t === 'light') document.documentElement.classList.add('light-early');
    })();
  </script>
  <style>
    html.light-early body { background: #f0f2f7; }

    .qty-input {
      width: 68px; text-align: center;
      padding: 7px 8px;
      font-family: 'JetBrains Mono', monospace;
    }
    .product-name-cell { font-weight: 600; color: var(--text); }

    .receipt-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 1000;
      align-items: center; justify-content: center;
      backdrop-filter: blur(6px); padding: 20px;
    }
    .receipt-modal.open { display: flex; }

    .receipt-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px;
      width: 100%; max-width: 400px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
      animation: modalPop 0.28s cubic-bezier(0.34,1.56,0.64,1) both;
      max-height: 90vh; overflow-y: auto;
    }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.9) translateY(16px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .receipt-box h3 { text-align: center; font-size: 17px; margin-bottom: 4px; }
    .receipt-box .receipt-sub {
      text-align: center; font-size: 11px;
      color: var(--text3); margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
<div id="toast"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- RECEIPT MODAL -->
<div class="receipt-modal" id="receiptModal">
  <div class="receipt-box">
    <h3>🧾 Sale Complete</h3>
    <div class="receipt-sub" id="receiptBillNo"></div>
    <div id="receiptContent"></div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="closeReceipt()">Close</button>
      <button class="btn btn-primary" style="flex:1;justify-content:center;" onclick="printReceipt()">🖨 Print</button>
    </div>
  </div>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🛒</div>
      <div class="sidebar-logo-text">
        <h2>POS System</h2>
        <p>Management Suite</p>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="theme-toggle-wrap">
      <button class="theme-toggle" onclick="toggleTheme()">
        <span class="toggle-icon" id="themeIcon">🌙</span>
        <span class="toggle-label" id="themeLabel">Dark Mode</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </button>
    </div>
    <div class="sidebar-footer" id="sidebarUser"></div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <h1>Point of Sale</h1>
      </div>
      <div class="topbar-right">
        <span class="topbar-meta" id="topbarDate"></span>
      </div>
    </div>

    <div class="page-body">
      <div class="sell-layout">

        <!-- PRODUCTS PANEL -->
        <div>
          <div class="filter-bar" style="margin-bottom:16px;">
            <input id="search" placeholder="🔍  Search products…" oninput="searchItems()">
            <select id="catFilter" onchange="searchItems()">
              <option value="">All Categories</option>
              <option>Drinks</option><option>Snacks</option>
              <option>Dairy</option><option>Grocery</option>
            </select>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Product</th><th>Category</th>
                    <th>Stock</th><th>Price</th>
                    <th>Qty</th><th>Add</th>
                  </tr>
                </thead>
                <tbody id="sellBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- CART PANEL -->
        <div class="cart-panel" id="cartPanel">
          <div class="cart-drag-handle" onclick="toggleCart()"></div>
          <div class="cart-header" id="cartHeader">
            <h3>🛒 Cart</h3>
            <span id="cartCount" class="badge badge-blue">0 items</span>
          </div>

          <div class="cart-items" id="cartItems">
            <div class="empty-state">
              <div class="empty-icon">🛒</div>
              <p>Cart is empty</p>
            </div>
          </div>

          <div class="cart-footer">
            <div class="cart-total-row">
              <span class="cart-total-label">Grand Total</span>
              <span class="cart-total-value" id="grandTotal">Rs 0</span>
            </div>
            <button class="btn btn-success" style="width:100%;justify-content:center;padding:13px;font-size:14px;" onclick="checkout()">
              ✓ Checkout
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  const user = authGuard(['admin', 'cashier']);
  let cart = [];
  let lastBillData = null;
  let cartExpanded = false;

  if (user) {
    buildSidebar(user);

    const now = new Date();
    document.getElementById('topbarDate').textContent =
      now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

    // Cart header tap to expand on mobile
    document.getElementById('cartHeader').addEventListener('click', function() {
      if (window.innerWidth <= 768) toggleCart();
    });

    function toggleCart() {
      if (window.innerWidth > 768) return;
      cartExpanded = !cartExpanded;
      document.getElementById('cartPanel').classList.toggle('cart-expanded', cartExpanded);
    }

    function searchItems() {
      const tbody = document.getElementById('sellBody');
      const search = document.getElementById('search').value.toLowerCase();
      const cat = document.getElementById('catFilter').value;
      const products = getProducts();
      let filtered = products.map((p, i) => ({ ...p, _i: i }));
      if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search));
      if (cat) filtered = filtered.filter(p => p.category === cat);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🔍</div><p>No products found</p></div></td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(p => `
        <tr>
          <td class="product-name-cell">${p.name}</td>
          <td><span class="badge badge-blue">${p.category}</span></td>
          <td style="font-family:'JetBrains Mono',monospace;${p.qty < 5 ? 'color:var(--warn);' : 'color:var(--success);'}font-weight:600;">
            ${p.qty < 5 ? '⚠ ' : ''}${p.qty}
          </td>
          <td style="font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text);">Rs ${p.price.toLocaleString()}</td>
          <td><input class="qty-input" id="qty-${p._i}" type="number" placeholder="1" min="1" max="${p.qty}"></td>
          <td>
            <button class="btn btn-primary btn-sm" onclick="addToCart(${p._i})" ${p.qty === 0 ? 'disabled' : ''}>
              ${p.qty === 0 ? 'Out' : '+ Add'}
            </button>
          </td>
        </tr>
      `).join('');
    }

    function addToCart(i) {
      const products = getProducts();
      const qtyEl = document.getElementById(`qty-${i}`);
      const qty = parseInt(qtyEl.value) || 1;
      if (qty <= 0) { toast('Enter a valid quantity', 'error'); return; }
      if (qty > products[i].qty) { toast(`Only ${products[i].qty} in stock`, 'error'); return; }
      const existing = cart.find(c => c.index === i);
      if (existing) {
        if (existing.qty + qty > products[i].qty) { toast('Not enough stock', 'error'); return; }
        existing.qty += qty;
        existing.total = existing.qty * products[i].price;
      } else {
        cart.push({ index: i, name: products[i].name, qty, price: products[i].price, total: qty * products[i].price });
      }
      qtyEl.value = '';
      toast(`${products[i].name} added`);
      renderCart();
      if (window.innerWidth <= 768 && !cartExpanded) {
        cartExpanded = true;
        document.getElementById('cartPanel').classList.add('cart-expanded');
      }
    }

    function removeFromCart(i) {
      cart.splice(i, 1);
      renderCart();
    }

    function renderCart() {
      const el = document.getElementById('cartItems');
      const total = cart.reduce((s, c) => s + c.total, 0);
      document.getElementById('cartCount').textContent = `${cart.length} item${cart.length !== 1 ? 's' : ''}`;
      document.getElementById('grandTotal').textContent = `Rs ${total.toLocaleString()}`;

      if (cart.length === 0) {
        el.innerHTML = `<div class="empty-state"><div class="empty-icon">🛒</div><p>Cart is empty</p></div>`;
        return;
      }

      el.innerHTML = cart.map((c, i) => `
        <div class="cart-item">
          <div style="flex:1;min-width:0;">
            <div class="cart-item-name">${c.name}</div>
            <div class="cart-item-qty">× ${c.qty} @ Rs ${c.price.toLocaleString()}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <span class="cart-item-price">Rs ${c.total.toLocaleString()}</span>
            <button class="cart-item-remove" onclick="removeFromCart(${i})">✕</button>
          </div>
        </div>
      `).join('');
    }

    function checkout() {
      if (cart.length === 0) { toast('Cart is empty', 'error'); return; }
      const products = getProducts();
      const billNo = Date.now();
      const totalAmount = cart.reduce((s, c) => s + c.total, 0);
      cart.forEach(c => { products[c.index].qty -= c.qty; });
      saveProducts(products);
      const sales = getSales();
      const bill = {
        billNo, items: cart.map(c => ({ name: c.name, qty: c.qty, price: c.price, total: c.total })),
        total: totalAmount, date: new Date().toISOString().split('T')[0], cashier: user.name
      };
      sales.push(bill);
      saveSales(sales);
      lastBillData = bill;
      cart = [];
      renderCart();
      searchItems();
      showReceipt(bill);
      if (cartExpanded) {
        cartExpanded = false;
        document.getElementById('cartPanel').classList.remove('cart-expanded');
      }
    }

    function showReceipt(bill) {
      document.getElementById('receiptBillNo').textContent = `Bill #${String(bill.billNo).slice(-8)} · ${bill.date}`;
      document.getElementById('receiptContent').innerHTML = `
        <div class="receipt-card">
          ${bill.items.map(it => `
            <div class="receipt-row"><span>${it.name} × ${it.qty}</span><span>Rs ${it.total.toLocaleString()}</span></div>
          `).join('')}
          <hr>
          <div class="receipt-row receipt-total"><span>TOTAL</span><span>Rs ${bill.total.toLocaleString()}</span></div>
          <div style="margin-top:8px;font-size:11px;color:var(--text3);">Cashier: ${bill.cashier}</div>
        </div>`;
      document.getElementById('receiptModal').classList.add('open');
    }

    function closeReceipt() { document.getElementById('receiptModal').classList.remove('open'); }

    function printReceipt() {
      if (!lastBillData) return;
      const b = lastBillData;
      const win = window.open('', '', 'width=380,height=500');
      win.document.write(`<html><head><title>Receipt</title><style>
        body{font-family:'Courier New',monospace;padding:20px;font-size:13px;}
        h2{text-align:center;}.row{display:flex;justify-content:space-between;margin:6px 0;}
        hr{border:none;border-top:1px dashed #aaa;margin:12px 0;}
        .total{font-size:16px;font-weight:bold;}.footer{text-align:center;margin-top:20px;font-size:11px;color:#666;}
      </style></head><body>
        <h2>🛒 POS Receipt</h2>
        <div class="row"><span>Bill:</span><span>#${b.billNo}</span></div>
        <div class="row"><span>Date:</span><span>${b.date}</span></div>
        <div class="row"><span>Cashier:</span><span>${b.cashier}</span></div>
        <hr>
        ${b.items.map(it=>`<div class="row"><span>${it.name} ×${it.qty}</span><span>Rs ${it.total}</span></div>`).join('')}
        <hr>
        <div class="row total"><span>TOTAL</span><span>Rs ${b.total}</span></div>
        <div class="footer">Thank you for your purchase!</div>
      </body></html>`);
      win.document.close(); win.focus(); win.print();
    }

    searchItems();
  }
</script>
</body>
</html>
